<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Iniciar sesión</h2>
    <form action="LoginServlet" method="post">
        <label>Correo:</label>
        <input type="text" name="correo" required><br>
        <label>Contraseña:</label>
        <input type="password" name="contraseña" required><br>
        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
